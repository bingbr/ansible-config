  - libvirt-daemon-kvm
  - libvirt-daemon-config-network
  - qemu-kvm
  - qemu-kvm-core
  - qemu-system-x86
  - qemu-system-x86-core

  # More of the same. The removal won't resolve without them.
  - python3-libvirt
  - virt-install
  - virt-viewer

  # Printing. cups-libs and cups-pk-helper stay, GNOME needs them.
  - braille-printer-app
  - cups
  - cups-browsed
  - cups-filters
  - cups-filters-driverless
  - bluez-cups
  - gutenprint
  - gutenprint-cups
