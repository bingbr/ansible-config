  - gnome-boxes
  - gnome-calendar
  - gnome-connections
  - gnome-maps
  - gnome-contacts
  - gnome-tour
  - gnome-photos
  - gnome-weather
  - cheese
  - snapshot
  - rhythmbox
  - totem
  - decibels
  - showtime
  - mediawriter
  - simple-scan
  - firefox
  - firefox-langpacks

  # Goes with LibreOffice.
  - unoconv

  # The live installer.
  - anaconda-live
  - anaconda-webui

  # The web console.
  - cockpit-ws
  - cockpit-ws-selinux
  - cockpit-bridge
  - cockpit-system
  - cockpit-networkmanager
  - cockpit-storaged

  # Virtualization. Guest agents are handled in tasks instead.
